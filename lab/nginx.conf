events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format for ChainGuard Log Agent
    # Includes client IP, ISO timestamp, method, URI, status, UA, Authorization header, and X-API-Key
    log_format chainguard_format '$remote_addr - [$time_iso8601] "$request_method" "$request_uri" '
                                 '$status "$http_user_agent" "$http_authorization" "$http_x_api_key"';

    access_log /var/log/nginx/access.log chainguard_format;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    upstream juiceshop_upstream {
        server juiceshop:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://juiceshop_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through authorization headers
            proxy_pass_header Authorization;
            proxy_pass_header X-API-Key;
        }
    }
}
