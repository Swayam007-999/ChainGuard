services:
  juiceshop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: chainguard-lab-juiceshop
    restart: unless-stopped
    # Internal port only - not published to host
    expose:
      - "3000"
    networks:
      - lab-network

  nginx:
    image: nginx:1.27-alpine
    container_name: chainguard-lab-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - juiceshop
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
